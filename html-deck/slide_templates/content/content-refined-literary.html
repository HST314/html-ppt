<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>背景模板 · 奢华质感/文艺克制（content 态）</title>
<style>
  /* ============================================================
     content-refined-literary.html —— 奢华质感/文艺克制 风格库预览（content 态）
     TASK-042 新建：奢华质感/文艺克制 分类，参考范例 Vellum。
     本文件由 scripts/bg_styles.py::generate_full_background("refined-literary", ...)
     真实生成逻辑产出（占位色示范，实际渲染时 palette 来自项目图片分析
     dna["palette"]），仅供人工预览/参考，不参与渲染时真正读取执行。
     ============================================================ */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    width: 1920px; height: 1080px;
    font-family: var(--font-sans, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif);
  }
  .bg-tpl {
    position: relative;
    width: 1920px; height: 1080px;
    overflow: hidden;
    color: #e9ddc4;
    display: block;
  }
  .bg-tpl .art-bg {
    position: absolute; inset: 0;
    width: 1920px; height: 1080px;
  }
  .bg-tpl .art-bg svg { width: 100%; height: 100%; display: block; }
  .bp-copy {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    padding: 150px 140px;
  }
  .bp-eyebrow {
    margin: 0 0 22px;
    font-family: var(--font-mono, "JetBrains Mono", monospace);
    font-size: 19px;
    letter-spacing: .34em;
    font-weight: 700;
    opacity: .78;
  }
  .bp-title {
    margin: 0;
    max-width: 1200px;
    font-size: clamp(40px, 3.4vw, 56px);
    font-weight: 800;
    line-height: 1.2;
    letter-spacing: -.01em;
  }
  .bp-tag {
    position: absolute;
    left: 140px; bottom: 56px;
    z-index: 2;
    margin: 0;
    font-size: 17px;
    letter-spacing: .04em;
    opacity: .6;
  }
</style>
</head>
<body>
<section class="slide role-content bg-tpl bg-refined-literary" data-role="content" data-template="content-refined-literary" data-bg-style="refined-literary" data-bg-category="奢华质感/文艺克制">
  <div class="art-bg" aria-hidden="true">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice"><rect width="1920" height="1080" fill="#0f1f1a"/><g opacity="0.450"><g transform="translate(1113.6 626.4) scale(0.42)"><line x1="140" y1="960" x2="640" y2="960" stroke="#c9a86a" stroke-width="1" opacity=".2"/><line x1="140" y1="945" x2="140" y2="975" stroke="#c9a86a" stroke-width="1" opacity=".3"/></g></g></svg>
  </div>
  <div class="bp-copy">
    <p class="bp-eyebrow">PRIVATE ED.</p>
    <h1 class="bp-title">{{content_title}}</h1>
  </div>
  <p class="bp-tag">奢华质感/文艺克制 · content 态</p>
</section>
</body>
</html>
