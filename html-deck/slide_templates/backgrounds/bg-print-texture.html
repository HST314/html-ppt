<!DOCTYPE html>

<head>

<title>背景模板 · 复古人文/印刷质感（cover 态）</title>
<style>
  /* ============================================================
     bg-print-texture.html —— 复古人文/印刷质感 风格库预览（cover 态）
     TASK-042 新建：复古人文/印刷质感 分类，参考范例 riso-print / Biennale Yellow。
     本文件由 scripts/bg_styles.py::generate_full_background("print-texture", ...)
     真实生成逻辑产出（占位色示范，实际渲染时 palette 来自项目图片分析

     ============================================================ */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    width: 1920px; height: 1080px;
    font-family: var(--font-sans, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif);
  }
  .bg-tpl {
    position: relative;
    width: 1920px; height: 1080px;
    overflow: hidden;
    color: #171310;
    display: block;
  }
  .bg-tpl .art-bg {
    position: absolute; inset: 0;
    width: 1920px; height: 1080px;
  }
  .bg-tpl .art-bg svg { width: 100%; height: 100%; display: block; }
  .bp-copy {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 220px;
  }
  .bp-eyebrow {
    margin: 0 0 22px;
    font-family: var(--font-mono, "JetBrains Mono", monospace);
    font-size: 24px;
    letter-spacing: .34em;
    font-weight: 700;
    opacity: .78;
  }
  .bp-title {
    margin: 0;
    max-width: 1200px;
    font-size: clamp(56px, 5.2vw, 92px);
    font-weight: 800;
    line-height: 1.2;
    letter-spacing: -.01em;
  }
  .bp-tag {
    position: absolute;
    left: 220px; bottom: 56px;
    z-index: 2;
    margin: 0;
    font-size: 17px;
    letter-spacing: .04em;
    opacity: .6;
  }
</style>
</head>
<body>
<section class="slide role-cover bg-tpl bg-print-texture" data-role="cover" data-template="bg-print-texture" data-bg-style="print-texture" data-bg-category="复古人文/印刷质感">

</html>
